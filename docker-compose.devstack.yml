services:
  fixture:
    build:
      context: .
    command: ["/usr/local/bin/devstack-fixture", "-addr", ":8081"]
    ports:
      - "18081:8081"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: llama_shim
      POSTGRES_USER: llama_shim
      POSTGRES_PASSWORD: llama_shim
    ports:
      - "15432:5432"
    volumes:
      - devstack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llama_shim -d llama_shim"]
      interval: 2s
      timeout: 5s
      retries: 30

  shim:
    build:
      context: .
    command: ["/usr/local/bin/shim", "-config", "/app/config.yaml"]
    depends_on:
      fixture:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://llama_shim:llama_shim@postgres:5432/llama_shim?sslmode=disable}
      RETRIEVAL_INDEX_BACKEND: ${RETRIEVAL_INDEX_BACKEND:-lexical}
      RETRIEVAL_EMBEDDER_BACKEND: ${RETRIEVAL_EMBEDDER_BACKEND:-disabled}
      RETRIEVAL_EMBEDDER_BASE_URL: ${RETRIEVAL_EMBEDDER_BASE_URL:-}
      RETRIEVAL_EMBEDDER_MODEL: ${RETRIEVAL_EMBEDDER_MODEL:-}
      RETRIEVAL_INDEX_PGVECTOR_ANN_ENABLED: ${RETRIEVAL_INDEX_PGVECTOR_ANN_ENABLED:-false}
      RETRIEVAL_INDEX_PGVECTOR_ANN_METHOD: ${RETRIEVAL_INDEX_PGVECTOR_ANN_METHOD:-hnsw}
      RETRIEVAL_INDEX_PGVECTOR_ANN_METRIC: ${RETRIEVAL_INDEX_PGVECTOR_ANN_METRIC:-cosine}
      RETRIEVAL_INDEX_PGVECTOR_ANN_DIMENSIONS: ${RETRIEVAL_INDEX_PGVECTOR_ANN_DIMENSIONS:-0}
      RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_M: ${RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_M:-16}
      RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_EF_CONSTRUCTION: ${RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_EF_CONSTRUCTION:-64}
      RETRIEVAL_INDEX_PGVECTOR_ANN_IVFFLAT_LISTS: ${RETRIEVAL_INDEX_PGVECTOR_ANN_IVFFLAT_LISTS:-100}
      RESPONSES_MODE: ${RESPONSES_MODE:-prefer_local}
      SQLITE_PATH: ${SHIM_SQLITE_PATH:-./.data/devstack/shim.db}
      LOG_FILE_PATH: ${SHIM_LOG_FILE_PATH:-./.data/devstack/shim.log}
    ports:
      - "18080:8080"
    volumes:
      - ./config.devstack.yaml:/app/config.yaml:ro
      - ./.data:/app/.data

  shim_secondary:
    profiles: ["multi-instance"]
    build:
      context: .
    command: ["/usr/local/bin/shim", "-config", "/app/config.yaml"]
    depends_on:
      fixture:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://llama_shim:llama_shim@postgres:5432/llama_shim?sslmode=disable}
      RETRIEVAL_INDEX_BACKEND: ${RETRIEVAL_INDEX_BACKEND:-lexical}
      RETRIEVAL_EMBEDDER_BACKEND: ${RETRIEVAL_EMBEDDER_BACKEND:-disabled}
      RETRIEVAL_EMBEDDER_BASE_URL: ${RETRIEVAL_EMBEDDER_BASE_URL:-}
      RETRIEVAL_EMBEDDER_MODEL: ${RETRIEVAL_EMBEDDER_MODEL:-}
      RETRIEVAL_INDEX_PGVECTOR_ANN_ENABLED: ${RETRIEVAL_INDEX_PGVECTOR_ANN_ENABLED:-false}
      RETRIEVAL_INDEX_PGVECTOR_ANN_METHOD: ${RETRIEVAL_INDEX_PGVECTOR_ANN_METHOD:-hnsw}
      RETRIEVAL_INDEX_PGVECTOR_ANN_METRIC: ${RETRIEVAL_INDEX_PGVECTOR_ANN_METRIC:-cosine}
      RETRIEVAL_INDEX_PGVECTOR_ANN_DIMENSIONS: ${RETRIEVAL_INDEX_PGVECTOR_ANN_DIMENSIONS:-0}
      RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_M: ${RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_M:-16}
      RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_EF_CONSTRUCTION: ${RETRIEVAL_INDEX_PGVECTOR_ANN_HNSW_EF_CONSTRUCTION:-64}
      RETRIEVAL_INDEX_PGVECTOR_ANN_IVFFLAT_LISTS: ${RETRIEVAL_INDEX_PGVECTOR_ANN_IVFFLAT_LISTS:-100}
      RESPONSES_MODE: ${RESPONSES_MODE:-prefer_local}
      SQLITE_PATH: ${SHIM_SECONDARY_SQLITE_PATH:-./.data/devstack/shim-secondary.db}
      LOG_FILE_PATH: ${SHIM_SECONDARY_LOG_FILE_PATH:-./.data/devstack/shim-secondary.log}
    ports:
      - "18082:8080"
    volumes:
      - ./config.devstack.yaml:/app/config.yaml:ro
      - ./.data:/app/.data

volumes:
  devstack-postgres-data:

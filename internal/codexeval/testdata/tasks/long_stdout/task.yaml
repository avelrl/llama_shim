id: long_stdout
title: Long stdout handling
category: command
suites:
  - codex-core
  - codex-bench-lite
  - codex-real-upstream
  - codex-real-upstream-expanded
timeout: 180s
attempts: 2
provenance:
  source: repo-owned synthesis inspired by Terminal-Bench
  url: https://www.tbench.ai/benchmarks
  notes: Long stdout handling task; no third-party files imported.
prompt: |
  This is the Codex long stdout case. Use exec_command to run `sh long_stdout.sh`.
  The command prints many lines and ends with LONG_STDOUT_DONE. That marker belongs only to command output.
  After confirming the command output marker, your final assistant reply must contain LONG_STDOUT_OK, not LONG_STDOUT_DONE.
  Do not edit files.
expected:
  final_text_contains:
    - LONG_STDOUT_OK
  files:
    - path: long_stdout.sh
      contains: LONG_STDOUT_DONE
  codex_events:
    - item.started:command_execution
    - item.completed:agent_message
    - turn.completed
  forbidden_codex_events:
    - item.started:file_change
    - item.completed:file_change
  forbidden_output:
    - "<|tool_call"
    - "<|tool_calls_section"
